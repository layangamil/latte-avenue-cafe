<!DOCTYPE html>
<html lang="en"> <!-- tells browser and screen readers page is in english-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content= "width=device-width, initial-scale=1.0"> <!-- view-port tag to make website responsive on mobile devices, by setting width to the device width -->
    <title>Latte Avenue - Checkout</title>
    <link rel="icon" type="image/jpg" href="image/pfp.jpg">
    <link rel="stylesheet" href= "css/style.css">
    <link rel="stylesheet" href= "css/responsive.css"> 
    <link rel="stylesheet" href= "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- 'Font Awesome' is an icon library. for shopping bag icon, plus icon, coffee mug -->
    <link rel="stylesheet" href= "https://cdn.jsdelivr.net/npm/simple-icons-font@v9/font/simple-icons.min.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <h1>Latte Avenue</h1>
                        <p class="tagline">Parisian Elegance in Every Sip</p>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <section class="payment-section">
        <div class="container">
            <div class="page-header">
                <h1>Checkout</h1>
            </div>

            <div class="payment-wrapper">
                <!-- Left side: order summary -->
                 <div class="payment-order-box">
                    <h2>Order Summary</h2>
                    <div id="payment-order-items" class="payment-order-items">
                        <!-- JS will write here -->
                    </div>
                    <div class="payment-total-box">
                        <div class="payment-row">
                            <span>Total(excl. tax)</span>
                            <span id="payment-subtotal" class="payment-subtotal">0 SEK</span>
                        </div>
                        <div class="payment-row">
                            <span>Tax(6%)</span>
                            <span id="payment-tax" class="payment-tax">0 SEK</span>
                        </div>
                        <div class="payment-row payment-final">
                            <strong>Total</strong>
                            <strong><span id="payment-total">0 SEK</span></strong>
                        </div>
                    </div>
                </div>

                <!-- Right side: Payment methods -->
                <div class="payment-method-box">
                    <h2>Select Payment Method</h2>

                    <div class="checkout-methods">
                         <!-- VISA CARD -->
                        <label class="payment-option-label">
                           <input type="radio" name="paymentMethod" value="visa" checked>
                           <div class="payment-option-content">
                               <i class="si si-visa"></i>
                           </div>
                       </label>
   
                       <!-- APPLE PAY -->
                       <label class="payment-option-label">
                           <input type="radio" name="paymentMethod" value="applepay">
                           <div class="payment-option-content">
                               <i class="si si-applepay"></i>
                               <span>Apple Pay</span>
                           </div>
                       </label>
   
                       <!-- KLARNA -->
                       <label class="payment-option-label">
                           <input type="radio" name="paymentMethod" value="klarna">
                           <div class="payment-option-content">
                               <i class="si si-klarna"></i>
                               <span>Klarna</span>
                           </div>
                       </label>
                    </div>
                    
                    <div class="v1"></div>

                    <!-- Entering card details (only if Visa is chosen)-->
                    <div id="card-details-container" class="card-details-box">
                        <h3>Enter Card Details</h3>
                        <input type="text" placeholder="Card Number" class="payment-input" id="card-number">

                        <div class="payment-row-fields">
                            <input type="text" placeholder="MM/YY" class="payment-input-half" id="card-expiry">
                            <input type="text" placeholder="CVC" class="payment-input-half" id="card-cvc">
                        </div>

                        <input type="text" placeholder="Card Holder Name" class="payment-input" id="card-name">
                    </div>

                    <div class="discount-input">
                        <label for="discountCode">Enter a coupon?</label>
                        <div class="discount-row">
                            <input type="text" id="discountCode" placeholder="Coupon code">
                            <button type="button" class="btn btn-secondary btn-small" id="applyDiscountBtn">Apply</button>
                        </div>
                    </div>

                    <button id="place-order-btn" class="btn btn-primary btn-big btn-fullwidth">Place Order</button>
                </div>
            </div>
        </div>
    </section>

    <script src="js/header.js"></script>
    <script src="js/cart.js"></script>  <!--if problem chnage to menu.js-->
    <script src="js/payment.js"></script>
</body>
</html>
