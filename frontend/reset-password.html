<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latte Avenue - Reset password</title>
    <link rel="icon" type="image/jpg" href="image/pfp.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href= "css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- 'Font Awesome' is an icon library. for shopping bag icon, plus icon, coffee mug -->
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <img class="logo" src="image/new_logo.png">
                    </a>
                </div>
            </div>
        </div>
    </header>

    <section class="reset-password-page">
        <div class="container">
            <div class="popup-container">
                <div class="popup-style"> 
                    <h3 class="popup-titel">Reset password</h3>
                    <p>Please enter your new password. </p>
                    <input type="password" id="passReset" class="popup-input" placeholder="New password">
                    <input type="password" id="confirmPassReset" class="popup-input" placeholder="Confirm new password">
                    <span id="matchPasswordMsg" style="font-size: 1rem; display: none;">Passwords do not match!</span>
                    <span id="missingInfoMsg" style="font-size: 1rem; display: none;">Please fill in all fields!</span>
                    
                    <div class="popup-btns">
                        <button id="resetBtn" class="btn btn-primary">Reset Password</button>
                        <button id="cancelReset" class="btn btn-secondary">Cancel</button>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <script src="js/reset-password.js"></script>
</body>
</html>
