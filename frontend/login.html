<!DOCTYPE html>
<html lang="en"> <!-- tells browser and screen readers page is in english-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- view-port tag to make website responsive on mobile devices, by setting width to the device width -->
    <title>Latte Avenue - Login</title>
    <link rel="stylesheet" href= "css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- 'Font Awesome' is an icon library. for shopping bag icon, plus icon, coffee mug -->
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <h1>Latte Avenue</h1>
                        <p class="tagline">Parisian Elegance in Every Sip</p>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <section class="login-page">
        <div class="container">
            <div class="page-header">
                <h1>Sign In / Sign Up</h1>
            </div>
        </div>
    </section>

    <section class="login-container">
        <div class="role">
            <h3>Customer</h3>
            <div class="customer-exist">
                <div class="input-container">
                    <form>
                        <input type="email" id="customer-login-email" placeholder="E-mail Address" required>
                        <input type="password" id="customer-login-password" placeholder="Password">
                    </form>
                </div>
                <button class="btn-login">Sign in</button>
            </div>
            <div class="customer-new">
                <h4>Create new account?</h4>
                <div class="input-container">
                   <form>
                        <input type="text" id="customer-signup-firstname" placeholder="First Name" required>
                        <input type="text" id="customer-signup-lastname" placeholder="Last Name" required>
                        <input type="email" id="customer-signup-email" placeholder="E-mail Address" required>
                        <input type="password" id="customer-signup-password" placeholder="Password" required>
                   </form>
                </div>
                <button class="btn-create">Create account</button>
            </div>
        </div>

        <div class="role" id="admin-section">
            <h3>Admin</h3>
            <div class="input-container">
                <form>
                    <input type="email" id="admin-login-email" placeholder="E-mail Address" required>
                    <input type="password" id="admin-login-password" placeholder="Password" required>
                </form>
            </div>
            <button class="btn-login">Log in</button>
        </div>
    </section>
    
    <script src="js/header.js"></script>
    <script src="js/login.js"></script>
</body> 
</html>
