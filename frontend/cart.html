<!DOCtype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- view-port tag to make website responsive on mobile devices, by setting width to the device width -->
    <title>Latte Avenue - Cart</title>
    <link rel="stylesheet" href= "css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- 'Font Awesome' is an icon library. for shopping bag icon, plus icon, coffee mug -->
</head>
<body>
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <h1>Latte Avenue</h1>
                        <p class="tagline">Parisian Elegance in Every Sip</p>
                    </a>
                </div>
                <nav>
                    <!-- navigation links -->
     <!-- **  -->   <a href="login.html" class="nav-item"><strong>Login</strong></a>
                    <a href="index.html" class="nav-item">Home</a>
                    <a href="index.html#menu" class="nav-item">Menu</a>
                    <a href="index.html#contact" class="nav-item">Contact</a>
                </nav>
            </div>
        </div>
    </header>
    <section class="cart-page">
        <div class="container">
            <h1>Your Shopping Cart</h1>

            <div id="container-cart-items" class="container-cart-items">
                <!-- cart.js will add items here-->
            </div>

            <div class="cart-info">
                <div class="cart-total">
                    <h3>Total SEK (inkl.tax) : </h3>
                    <span id="cart-total" class="total-amount">0.00</span>
                </div>
                <button id="checkout-btn" class="btn btn-primary">Proceed to Checkout</button>
            </div>
        </div>
        
    </section>

    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
