<!DOCtype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- view-port tag to make website responsive on mobile devices, by setting width to the device width -->
    <title>Latte Avenue - Cart</title>
    <link rel="stylesheet" href= "css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- 'Font Awesome' is an icon library. for shopping bag icon, plus icon, coffee mug -->
</head>
<body>
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <h1>Latte Avenue</h1>
                        <p class="tagline">Parisian Elegance in Every Sip</p>
                    </a>
                </div>
                <nav>
                    <!-- navigation links -->
                    <a href="index.html" class="nav-item">Home</a>
                    <a href="index.html#menu" class="nav-item">Menu</a>
                    <a href="index.html#contact" class="nav-item">Contact</a>
                    <a href="cart.html" class="nav-item">
                        <i class="fas fa-shopping-bag"></i>
                        <span id="cart-count" class="cart-count">0</span> <!-- span, bc it doesnt break line (inline -element) JS needs a unique id to find and update cart nr. class cart-count is for styling, ID for JS -->
                    </a>
                    <a href="login.html" id="loginLink" class="nav-item">
                        <i class="fa-solid fa-circle-user"></i><strong>Login</strong>
                    </a>

                    <div class="dropdown" id="accountDropdown" style="display:none">
                        <button>My Account ▼</button>
                        <div class="dropdown-content">
                            <a href="profile.html">
                                <i class="fa-solid fa-circle-user"></i>Profile
                            </a>
                            <a href="my-orders.html">Orders</a>
                            <a href="#" id="customerSignoutBtn">Sign Out</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <div class="content-wrapper">
        <section class="cart-page">
            <div class="container">
                <div class="page-header">
                    <h1>Your Shopping Cart</h1>
                </div>
                <div id="cart-items-container" class="cart-items-container">
                    <!-- cart.js will add items here-->
                </div>
    
                <div class="cart-summary">
                    <div class="cart-total">
                        <h3>Total SEK (incl.tax):</h3>
                        <span id="cart-total" class="total-amount">0.00</span>
                    </div>
                    <button id="checkout-btn" class="btn-primary">Proceed to Checkout</button>
                </div>
            </div>
        </section>
    </div>
    
    <footer class="footer-section">
        <div class="container">
            <h4>Follow us on our socials</h4>
            <div class="socials">
                <a href="https://www.instagram.com/latte_avenue_sthlm/" target="_blank">Instagram</a>
                <a href="https://www.tiktok.com/@latte_avenue_sthlm?lang=en-GB" target="_blank">TikTok</a>
                <a href="https://www.facebook.com/profile.php?id=61588507070670" target="_blank">Facebook</a>
            </div>
            <p>© 2026 Latte Avenue Café. All rights reserved.</p>
        </div>
    </footer>
    


    <script src="js/header.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
