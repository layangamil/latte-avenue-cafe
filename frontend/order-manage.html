<!DOCTYPE html>
<html lang="en"> <!-- tells browser and screen readers page is in english-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- view-port tag to make website responsive on mobile devices, by setting width to the device width -->
    <title>Admin - Order Management</title>
    <link rel="stylesheet" href= "css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- 'Font Awesome' is an icon library. for shopping bag icon, plus icon, coffee mug -->
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <h1>Latte Avenue</h1>
                        <p class="tagline">Admin Panel</p>
                    </a>
                </div>
                <nav class="admin-nav">
                    <!-- navigation links -->
                    <a href="order-manage.html" class="nav-item">Manage Orders</a>
                    <a href="menu-manage.html" class="nav-item">Manage Menu</a>
                    <a href="#" id="adminLogoutBtn" class="nav-item" onclick="adminLogout()">
                        <i class="fa-solid fa-circle-user"></i>
                        <strong>Sign Out</strong></a>
                </nav>
            </div>
        </div>
    </header>

    <section class="order-manage-page">
        <div class="container">
            <div class="page-header">
                <h1>Order Management</h1>
            </div>
            <div class="orders-list" id="orders-list">
                <!--JS will fill in code here -->
            </div>
        </div>
    </section>

    <script>
        function adminLogout() {
            if(confirm('Sign Out?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userRole');
                window.location.href = 'index.html';
            }
        }
    </script>
    <script src="js/order-manage.js"></script>
</body>
</html>
