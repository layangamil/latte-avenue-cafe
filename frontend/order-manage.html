<!DOCTYPE html>
<html lang="en"> <!-- tells browser and screen readers page is in english-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- view-port tag to make website responsive on mobile devices, by setting width to the device width -->
    <title>Admin - Order Management</title>
    <link rel="stylesheet" href= "css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- 'Font Awesome' is an icon library. for shopping bag icon, plus icon, coffee mug -->
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <h1>Latte Avenue</h1>
                        <p class="tagline">Parisian Elegance in Every Sip</p>
                    </a>
                </div>
                <nav>
                    <!-- navigation links -->
                    <a href="index.html" class="nav-item">Home</a>
                    <a href="index.html#menu" class="nav-item">Menu</a>
                    <a href="index.html#contact" class="nav-item">Contact</a>
                    <a href="cart.html" class="nav-item">
                        <i class="fas fa-shopping-bag"></i>
                        <span id="cart-count" class="cart-count">0</span> <!-- span, bc it doesnt break line (inline -element) JS needs a unique id to find and update cart nr. class cart-count is for styling, ID for JS -->
                    </a>
                    <a href="login.html" id="loginLink" class="nav-item">
                        <i class="fa-solid fa-circle-user"></i><strong>Login</strong>
                    </a>

                    <div class="dropdown" id="accountDropdown" style="display:none">
                        <button>My Account ▼</button>
                        <div class="dropdown-content">
                            <a href="profile.html">
                                <i class="fa-solid fa-circle-user"></i>Profile
                            </a>
                            <a href="my-orders.html">Orders</a>
                            <a href="#" id="customerSignoutBtn">Sign Out</a>
                        </div>
                    </div>

                    <div id="adminNav" style="display:none">
                        <a href="order-manage.html" class="nav-item">Order Management</a>
                        <a href="menu-manage.html" class="nav-item">Menu Management</a>
                        <a href="#" id="adminSignoutBtn" class="nav-item"><strong>Sign Out</strong></a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <section class="orders-page">
        <div class="container">
            <div class="page-header">
                <h1>Order Management</h1>
            </div>
            <div class="orders-list" id="orders-list">
                <!--JS will fill in code here -->
            </div>
        </div>
    </section>

<body>

    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script src="js/order-manage.js"></script>
</body>
</html>
