<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Admin - Menu Managent</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
</head>

<body>
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <h1>Latte Avenue</h1>
                        <p class="tagline">Parisian Elegance in Every Sip</p>
                    </a>
                </div>
                <nav>
                    <!-- navigation links -->
                    <a href="index.html" class="nav-item">Home</a>
                    <a href="index.html#menu" class="nav-item">Menu</a>
                    <a href="index.html#contact" class="nav-item">Contact</a>
                    <a href="cart.html" class="nav-item">
                        <i class="fas fa-shopping-bag"></i>
                        <span id="cart-count" class="cart-count">0</span> <!-- span, bc it doesnt break line (inline -element) JS needs a unique id to find and update cart nr. class cart-count is for styling, ID for JS -->
                    </a>
                    <a href="login.html" id="loginLink" class="nav-item">
                        <i class="fa-solid fa-circle-user"></i><strong>Login</strong>
                    </a>

                    <div class="dropdown" id="accountDropdown" style="display:none">
                        <button>My Account ▼</button>
                        <div class="dropdown-content">
                            <a href="profile.html">
                                <i class="fa-solid fa-circle-user"></i>Profile
                            </a>
                            <a href="my-orders.html">Orders</a>
                            <a href="#" id="customerSignoutBtn">Sign Out</a>
                        </div>
                    </div>

                    <div id="adminNav" style="display:none">
                        <a href="order-manage.html" class="nav-item">Order Management</a>
                        <a href="menu-manage.html" class="nav-item">Menu Management</a>
                        <a href="#" id="adminSignoutBtn" class="nav-item"><strong>Sign Out</strong></a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <section class="menu-manage-page">
        <div class="container">
            <div class="page-header">
                <h1>Menu Management</h1>
            </div>
            
            <div class="menu-manage">
                <div class="section-header">
                    <h2>Drinks Menu</h2>
                </div>

                <div class="items-list" id="drinks-list">
                    <!-- js will fill here, each menu item , update button and delete button on their own line                                   --> 
                    <p>Loading drinks</p>
                </div>
    
                <button class="btn-add" onclick="openAddForm('drinks')">+ Add New Drink</button>
            </div>

            <!--Desserts Section -->
            <div class="desserts-manage">
                <h2>Desserts Menu</h2>

                <div class="items-list" id="dessert-list">
                    <!--JS will fill in code here-->
                    <p>Loading desserts...</p>
                </div>

                <button class="btn-add" onclick="openAddForm('desserts')">+Add New Dessert</button>
            </div>
            
           <!--pop-up form (same for add and update)-->
           <div id="popupForm" class="popup-overlay" style="display:none;">
                <div class="popup-content">
                    <h3 id="popupTitle">Add New Item</h3>
                    <form id="menuItemForm">
                        <input type="hidden" id="itemId">
                        <input type="hidden" id="itemCategory">

                        <div class="form-group">
                            <label>Name:</label>
                            <input type="text" id="itemName" required>
                        </div>

                        <div class="form-group">
                            <label>Price (SEK):</label>
                            <input type="number" id="itemPrice" step=0.1 required>
                        </div>

                        <div class="form-group">
                            <label>Description/ Allergy:</label>
                            <textarea id="itemDescription" rows="2" required>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Save</button>
                            <button type="button" onclick="closePopup()" class="btn-secondary">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

           <!--Bottom buttons -->
            <div class="bottom-actions">
                <button onclick="saveAllChanges()" class="btn-primary">Save Changes</button>
                <button onclick="cancelAllChanges()" class="btn-primary" >Cancel Changes</button>
           </div>
        </div>
    </section>


    <script src="js/header.js"></script>
    <script src="js/menu-manage.js"></script>
</body>
</html>
