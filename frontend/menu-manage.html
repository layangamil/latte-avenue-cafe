<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Menu Management</title>
    <link rel="icon" type="image/jpg" href="image/pfp.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href= "css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
</head>

<body>
    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->
            <div class="header-content">
                <div class="logo">
                    <h1>Latte Avenue</h1>
                    <p class="tagline">Admin Panel</p>
                </div>
                <nav class="admin-nav">
                    <!-- navigation links -->
                    <a href="order-manage.html" class="nav-item">Order Management</a>
                    <a href="menu-manage.html" class="nav-item">Menu Management</a>
                    <a href="#" id="adminLogoutBtn" class="nav-item" onclick="adminLogout()">
                        <i class="fa-solid fa-circle-user"></i>
                        <strong>Sign Out</strong></a>
                </nav>
            </div>
        </div>
    </header>

    <section class="menu-manage-page">
        <div class="container">
            <div class="page-header">
                <h1>Menu Management</h1>
            </div>
            
            <!--Drinks Section -->
            <div class="drinks-manage">
                <div class="section-header">
                    <h2>Drinks Menu</h2>
                </div>

                <div class="items-list" id="drinks-list">
                    <!-- js will fill here, each menu item , update button and delete button on their own line                                   --> 
                    <p>Loading drinks</p>
                </div>
    
                <button class="btn btn-primary" onclick="addNewRow('drinks')">+ Add New Drink</button>
            </div>

            <!--Desserts Section -->
            <div class="desserts-manage">
                <div class="section-header">
                    <h2>Desserts Menu</h2>
                </div>

                <div class="items-list" id="desserts-list">
                    <!--JS will fill in code here-->
                    <p>Loading desserts...</p>
                </div>

                <button class="btn btn-primary" onclick="addNewRow('desserts')">+Add New Dessert</button>
            </div>

           <!--Bottom buttons -->
            <!-- <div class="bottom-actions">
                <button onclick="saveAllChanges()" class="btn-primary">Save Changes</button>
                <button onclick="cancelAllChanges()" class="btn-primary">Cancel unsaved changes</button>
            </div> -->
        </div>
    </section>

    <script>
        function adminLogout() {
            if(confirm('Sign Out?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userRole');
                window.location.href = 'index.html';
            }
        }
    </script>
    <script src="js/menu-manage.js"></script>
</body>
</html>
