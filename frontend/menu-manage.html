    <header class="main-header">
        <div class="container"> <!-- common pattern to limit content width and center it, in css-->

                <nav class="admin-nav">
                    <!-- navigation links -->
                    <a href="order-manage.html" class="nav-item">Order Management</a>
                    <a href="menu-manage.html" class="nav-item">Menu Management</a>

            <div class="drinks-manage">
                <div class="section-header">
                    <h2>Drinks Menu</h2>
                </div>

                <div class="items-list" id="drinks-list">
                    <!-- js will fill here, each menu item , update button and delete button on their own line                                   --> 
                    <p>Loading drinks</p>
                </div>
    
                <button class="btn-add" onclick="addNewRow('drinks')">+ Add New Drink</button>
            </div>

            <!--Desserts Section -->
            <div class="desserts-manage">
                <div class="section-header">
                    <h2>Desserts Menu</h2>
                </div>

                <div class="items-list" id="desserts-list">
                    <!--JS will fill in code here-->
                    <p>Loading desserts...</p>
                </div>

                <button class="btn-add" onclick="addNewRow('desserts')">+Add New Dessert</button>
            </div>
            
           <!--pop-up form (same for add and update)--
           <div id="popupForm" class="popup-overlay" style="display:none;">
                <div class="popup-content">

                    <form id="menuItemForm">
                        <input type="hidden" id="itemId">

                        <div class="form-group">

                </div>

           <!--Bottom buttons -->
            <div class="bottom-actions">
                <button onclick="saveAllChanges()" class="btn-primary">Save Changes</button>
                <button onclick="cancelAllChanges()" class="btn-secondary">Cancel Changes</button>
           </div>
        </div>
    </section>


    <script>
        function adminLogout() {
            if(confirm('Sign Out?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userRole');
                window.location.href = 'index.html';
            }
        }
    </script>
    <script src="js/menu-manage.js"></script>

</html>
